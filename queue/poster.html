<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster – Scan to join the queue | 並ぶ前にQRコード</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="queue.css">
<style>
body{background:#fff;color:#111;text-align:center;padding:24px;font-family:var(--sans)}
.p{max-width:560px;margin:0 auto;border:6px solid #111;border-radius:28px;padding:32px 24px}
.p h1{font-family:var(--serif);font-size:38px;margin:0 0 4px;line-height:1.2}
.p h2{font-family:var(--serif);font-size:26px;margin:0 0 18px;font-weight:700}
.p img{width:min(100%,380px);height:auto;image-rendering:pixelated}
.p p{margin:10px 0;font-size:18px}
.demo{display:inline-block;background:#111;color:#fff;padding:2px 12px;border-radius:8px;font-size:14px;letter-spacing:.1em}
.noprint{margin-top:22px}
@media print{.noprint{display:none}}
</style>
</head>
<body>
<div class="p">
  <p><span class="demo">DEMO</span></p>
  <h1>Scan to join the queue</h1>
  <h2 lang="ja">QRコードで順番待ち</h2>
  <img src="../assets/queue-qr.png" width="380" height="380" alt="QR code to https://network26.github.io/jigokumushi-demo/queue/">
  <p>地獄蒸し工房 鉄輪 · Jigokumushi Kobo Kannawa</p>
  <p style="font-size:13px;color:#555">Demo poster: the demo queue works only inside one browser.</p>
</div>
<p class="noprint"><button class="btn btn-fire" onclick="window.print()">Print / 印刷</button></p>
</body>
</html>
